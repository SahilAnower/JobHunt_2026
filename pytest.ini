# Three lines on purpose. A pyproject.toml would imply this repo is a distributable package,
# and it is not — it is a handful of scripts and one SQLite file.
#
# `pythonpath = .` is what lets tests/ do `import fetch`. Without it pytest puts only tests/
# on sys.path and every import fails. An empty conftest.py would work by side effect; this
# says what it means.
[pytest]
testpaths = tests
pythonpath = .
