# ---------------------------------------------------------------------------------------------
# profile.example.yaml — copy to profile.yaml and edit. This is the only file with opinions
# about you in it, and it is the one that decides what the digest shows you.
#
#     cp config/profile.example.yaml config/profile.yaml
#
# profile.yaml is gitignored. This example is not, so keep real details out of it.
# Every key below is read by the code; deleting one will break a run.
# ---------------------------------------------------------------------------------------------

candidate:
  name: Your Name
  short_name: You              # used in draft salutations
  email: you@example.com
  phone: "+91 0000000000"
  base_city: Hyderabad         # "home" geography — roles here need no relocation
  country: India
  # Where you work now, used by the outreach drafts. Leave `employer` blank and the drafts
  # simply omit it rather than leaving a dangling "at ". Flip `employer_is_current` to false
  # the day you leave: it switches the drafts from "I work on X at Y" to "I worked on X at Y",
  # so a draft never claims a job you no longer hold.
  employer: Example Corp
  employer_is_current: true
  tenure_phrase: just over two years in   # blank is fine; omitted cleanly when empty
  links:
    linkedin: https://www.linkedin.com/in/your-handle
    github: https://github.com/your-handle
    leetcode: 500+ problems solved

# Pasted near-verbatim into the scoring and drafting prompts. Write it as prose, not bullets,
# and be concrete: the scorer can only judge overlap it can actually see. Include your stack,
# scale numbers, and the two or three projects you would talk about in a screen.
resume_summary: |
  Three years as a backend engineer. Java and Spring Boot against AWS — Lambda, DynamoDB,
  S3, ECS, CDK. Shipped a multi-region service handling ~2k requests/second and cut p99
  latency 40% by reworking the caching layer.

  Recent work: an internal agentic tool using an LLM to triage support tickets, which
  removed roughly 15 hours of manual work a week. Built on Amazon Bedrock.
  Multi-agent pipeline driven by prompt engineering and tool use.

  Gaps to be honest about: no production frontend work beyond small React changes, and no
  Kubernetes ownership.

roles:
  # Free text. These three strings go straight into the prompt, so phrase them the way you
  # would describe the job you want.
  lane_a: Backend / distributed systems / platform engineering (Java, Spring Boot, AWS)
  lane_b: Agentic AI / LLM application engineering
  band: IC, SDE I to SDE II (Software Engineer / Software Engineer II / SDE)

filters:
  # A title must match one of these to survive. Matched case-insensitively as substrings.
  include_titles:
    - software engineer
    - software development engineer
    - software developer
    - sde
    - backend
    - back end
    - back-end
    - full stack
    - distributed systems
    - platform engineer
    - infrastructure engineer
    - systems engineer
    - cloud engineer
    - api engineer
    - java developer
    - member of technical staff
    # Allowed deliberately: SMTS (Senior Member of Technical Staff) sits close enough to
    # SDE II/III at some employers to be worth reading. Listed here as well as removed from
    # exclude_titles so a bare "SMTS, Data Cloud" title still matches the include list.
    - smts
    - ai engineer
    - ml engineer
    - llm
    - genai
    - agent
    - forward deployed

  # The seniority ceiling, and the highest-leverage list in this file. Public boards are
  # dominated by Senior/Staff/Principal reqs, so this is what drops the large majority of
  # what gets fetched. Checked BEFORE include_titles — an exclusion always wins.
  #
  # Matched whole-word with an optional trailing period, so "sr" covers "Sr" and "Sr." and
  # will not fire inside "SRE". Raise or lower this block to move your band.
  exclude_titles:
    - senior
    - sr
    - staff
    - principal
    - lead            # "Lead Engineer" yes; "Leader" needs its own entry, below
    - leader
    - leadership
    - architect
    - manager
    - mgr             # Some boards abbreviate it in slugs, and NetApp's do: without this,
                      # "Mgr Software Engineer" clears a list containing only "manager".
                      # Every abbreviation of a band needs its own entry, as SMTS/PMTS do.
    - director
    - head of
    - vp
    - vice president
    - chief
    - distinguished
    - fellow
    # Some employers write the whole band as an abbreviation, so the spelled-out ceiling never
    # fires. MTS and SMTS are both treated as in band (see include_titles); these three are
    # Lead/Principal/Distinguished Member of Technical Staff and are not.
    - lmts
    - pmts
    - dmts
    # Not engineering, and these flood every board.
    - intern
    - internship
    - apprentice
    - trainee
    - account executive
    - sales
    - marketing
    - recruiter
    - recruiting
    - payroll
    - accountant
    - counsel
    - designer
    - program manager
    - product manager
    - project manager

  # Phrases blanked out of the title BEFORE exclude_titles runs, for in-band titles that
  # happen to contain a seniority word. The ceiling still applies to the rest of the title,
  # so "Lead Member of Technical Staff" is still dropped on "lead".
  # Longest first — these are applied in order, and blanking the short form first would leave
  # "senior"/"sr" behind and drop a title we mean to keep.
  exclude_overrides:
    - senior member of technical staff
    - sr member of technical staff
    - member of technical staff

  # Anything matching include_titles but not this is tagged Lane B in the digest.
  lane_a_titles:
    - software engineer
    - software development engineer
    - software developer
    - sde
    - backend
    - back end
    - back-end
    - distributed systems
    - platform engineer
    - infrastructure engineer
    - systems engineer
    - cloud engineer
    - java developer

geo:
  # Geography is an ALLOWLIST, not a denylist. With require_india_signal on, a posting with no
  # match in any list below is dropped. The alternative — enumerating foreign cities — is never
  # complete, and every gap leaks an out-of-country req into the digest.
  #
  # Precedence when several match: home > remote > relocate > country. That is the order you
  # would actually prefer the outcomes in.
  country_terms:
    - india
    - bharat
  home_terms:            # no relocation needed
    - hyderabad
    - telangana
    - secunderabad
  relocation_terms:      # in-country but you would have to move
    - bangalore
    - bengaluru
    - pune
    - gurgaon
    - gurugram
    - noida
    - delhi
    - ncr
    - chennai
    - mumbai
    - kolkata
    - ahmedabad
    - kochi
    - coimbatore
    - chandigarh
    - jaipur
    - indore
  remote_terms:
    - remote
    - work from home
    - wfh
    - anywhere
  require_india_signal: true

comp:
  currency: INR
  target_lpa: 45
  floor_lpa: 38              # below this is a discard
  min_fixed_lpa: 28          # fixed base, separate from total
  # Indian postings almost never publish a band, so the scorer judges this from the company and
  # the level. Explain anything unusual about your current package here — a scorer that thinks
  # you already earn more than you do will mark good roles down.
  note: |
    Current total is inflated in year one by a non-repeating sign-on and a back-loaded vest;
    steady state is meaningfully lower. So an offer that looks flat on total may be a real
    raise in recurring cash. Flag those rather than discarding them.
  dealbreakers:
    - service-based or consultancy comp bands
    - employment bonds or notice-lock clauses
    - equity-heavy offers with a weak fixed base
    - commission or variable-only structures

# Free text, pasted into the scoring prompt. This is where you tell the scorer what actually
# matters right now, including anything awkward. Be blunt — it tunes every score in the digest.
situation: |
  Timeline: looking to move within three months, not urgently.

  Consequences for scoring:
  - Speed matters. A 7 that can produce a signed offer in six weeks beats a 9 with a
    four-month loop.
  - The weak point is the resume screen, not sourcing. Weight roles where a referral is
    plausible over marginally better cold ones.
  - Reason for leaving, the version to use: growth.
  - Years of experience: ~3. Treat a JD asking for 5+ years as a stretch that needs a
    referral, and 8+ as effectively closed.

# What the drafter must never put in a referral message, and the one sanctioned answer to "why
# are you leaving". Kept here rather than in draft.py on purpose: draft.py is version-controlled
# and this is the most sensitive thing the pipeline knows about you. Leave the list empty if
# there is nothing to hide.
drafting:
  never_mention:
    - anything about the current team that is not public
    - an employment gap, unless asked directly
  reason_for_leaving: >-
    growth — the scope you want is not available on the current team. Never elaborate
    beyond this.

exclusions:
  # Dropped before anything else, by company name. Staffing firms, ex-employers, anywhere you
  # would not go.
  #
  # Keep this list long if you poll an aggregator. On an employer board the company is implied by
  # which board you polled, so a short list is fine. An aggregator like Instahyre returns reqs
  # from hundreds of employers, and agencies dominate the volume — one of them posted 405
  # openings in a single snapshot. Names worth having from the Indian market: the IT-services
  # majors (TCS, Infosys, Wipro, Accenture, Cognizant, Capgemini, LTIMindtree, Tech Mahindra,
  # HCLTech, Mphasis), the recruitment agencies (Randstad, Adecco, ManpowerGroup, Hays, Michael
  # Page, ABC Consultants, CIEL HR, Careernet, Xpheno, TeamLease, Quess) and the project-delivery
  # shops (EPAM, Luxoft, Nagarro, GlobalLogic, Thoughtworks, Publicis Sapient, Synechron).
  companies:
    - Example Consultancy
    - Example Staffing
  # Not read by the code — kept as a note to yourself about categories to skip while curating
  # config/seed.yaml. Note the asymmetry: `industries` is prose for the scorer, so it only
  # influences a score. `companies` above is the hard gate that actually drops a req.
  industries:
    - staffing, contract-to-hire, third-party payroll, agency placement
    - unfunded or pre-seed startups with no disclosed funding
    - client-project delivery rather than owning a product

targets:
  # The companies you care about. Used for reporting and for the email-alert checklist; the
  # actual polling is driven by config/seed.yaml.
  companies:
    - Databricks
    - Cloudflare
    - Atlassian
    - Adobe
    - Salesforce
  # Flagged in the digest as likely to pay below your band for the title.
  comp_risk:
    - Example Bank

# ---------------------------------------------------------------- the heuristic engine's knobs

# Read ONLY by `engine: heuristic`. Every key is optional: omit the whole block and the defaults
# in engine_heuristic.DEFAULTS apply, which are the calibrated values recorded in CALIBRATION.md.
# A test asserts this block round-trips to those defaults, so the two cannot drift.
#
# Tune `base` first. It shifts how many reqs clear score_threshold without changing their order,
# so raise it for a fuller digest and lower it for a stricter one.
#
# Four rules the loader enforces at startup rather than letting them fail silently:
#   1. Every weight is SIGNED and added as-is. Penalties are negative and a *_cap is a negative
#      floor. A positive value on a penalty key is a startup error naming the key.
#   2. A *_saturate key is a divisor and must be positive.
#   3. Every term in every vocabulary must be lowercase. The matcher builds lowercase-only
#      character classes, so an uppercase term would never match. Quote numerals ("2", not 2)
#      so they load as strings.
#   4. A term belongs to exactly one skills tier, must not be on your resume's "Never claim"
#      list, and every aliases key must name a term that exists in a tier.
#
# One matching trap worth knowing: a term starting with punctuation will not match when that
# punctuation follows a letter. Spell the whole token, `asp.net`, not the suffix, `.net`.
#
# `skills` weights encode how central a thing is to YOUR resume, not how popular it is in the
# market. The `boilerplate` tier is different in kind: it holds vocabulary every JD uses that
# this resume does not evidence at all, and its ENTIRE summed contribution is capped at
# `boilerplate_cap`. Do not promote a term into a scored tier to boost it; if the resume gained
# the skill, add it to the resume first and then move the term.

scoring:
  my_yoe: 2.4
  tolerance: 1.0
  below_at: 1.0
  base: 3.7
  base_no_jd: 4.2
  ceiling: 9
  weights:
    yoe_in_band: 1.3
    yoe_below_band: -1.0
    yoe_per_year_over: -0.55
    yoe_floor: -2.2
    overlap_max: 3.0
    overlap_saturate: 4.0
    # How much a skill match is worth depending on WHERE the JD names it. A term inside the
    # requirements/qualifications block counts at `overlap_zone_mult` of its skills weight; a
    # term named only in the preamble counts at `overlap_preamble_mult`, because marketing
    # prose mentioning Java is weaker evidence than Java under "Requirements:". A JD with no
    # such heading has no preamble to discount, so every term is a zone match and the number
    # is unchanged. Set `overlap_preamble_mult: 1.0` to switch the distinction off.
    overlap_zone_mult: 1.0
    overlap_preamble_mult: 0.6
    boilerplate_cap: 0.5
    off_lane_max: -2.0
    off_lane_saturate: 1.5
    # Negative evidence, counted rather than detected: see `own_stack` / `foreign_stacks`
    # below. `dominant_stack_max` is the floor of the penalty and `dominant_stack_saturate` is
    # how many mentions reach it. A stack named in the TITLE counts
    # `dominant_stack_title_mult` times, because a stack in the title is the job rather than
    # something the job touches. It fires only when the dominant foreign stack clears BOTH
    # `dominant_stack_min_mentions` and `dominant_stack_ratio` times your own mentions, so a
    # single passing mention, or a genuine backend JD that also names a front end, is safe.
    dominant_stack_max: -2.0
    dominant_stack_saturate: 6.0
    dominant_stack_title_mult: 2.0
    dominant_stack_min_mentions: 3
    dominant_stack_ratio: 1.5
    never_claim_per: -0.6
    never_claim_cap: -1.8
    cs_degree_required: -0.8
    services_per: -0.8
    services_cap: -2.4
    title_in_band: 0.5
    title_above_band: -0.5
    title_below_band: -1.6
    title_excluded: -2.0
    target_employer: 0.8
    comp_risk_employer: 0.0
    no_jd_title_in_band: 2.6
    no_jd_target_employer: 2.6
    no_jd_title_excluded: -2.6
  geo_points:
    home: 0.6
    remote: 0.5
    relocate: 0.0
    india: 0.0
    unclear: -0.4
  geo_points_no_jd:
    home: 0.8
    remote: 0.6
    relocate: 0.0
    india: 0.0
    unclear: 0.3
  source_bonus:
    instahyre: -0.3
    seed: -0.1
